services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Define MONGO_ROOT_USERNAME en .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Define MONGO_ROOT_PASSWORD en .env}
      MONGO_INITDB_DATABASE: control_ventas
      APP_USERNAME: ${APP_USERNAME:?Define APP_USERNAME en .env}
      APP_PASSWORD: ${APP_PASSWORD:?Define APP_PASSWORD en .env}
    volumes:
      - mongo_data:/data/db
      - ./init:/docker-entrypoint-initdb.d:ro
    mem_limit: 512m
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --username
        - ${MONGO_ROOT_USERNAME}
        - --password
        - ${MONGO_ROOT_PASSWORD}
        - --authenticationDatabase
        - admin
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://${APP_USERNAME}:${APP_PASSWORD}@mongo:27017/control_ventas?authSource=control_ventas
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
    mem_limit: 256m

volumes:
  mongo_data:
